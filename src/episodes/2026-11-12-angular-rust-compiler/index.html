<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Byteling short</title>
<style>
  :root { --cyan:#5ee6ff; --yellow:#ffd84a; --purple:#b79cff; --orange:#ff9d4d; --green:#4ade80; --red:#ff5a5a; --ink:#070b16; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#070b16; overflow:hidden; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:'Inter',sans-serif; color:#fff; }
  #gl { position:absolute; inset:0; width:1080px; height:1920px; display:block; }
  #vig { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 85% 60% at 50% 40%, rgba(7,11,22,0) 55%, rgba(4,6,14,.72) 100%),
      linear-gradient(to bottom, rgba(4,6,14,.55) 0, rgba(4,6,14,0) 14%, rgba(4,6,14,0) 56%, rgba(4,6,14,.88) 68%, rgba(4,6,14,.97) 100%); }
  .abs { position:absolute; left:0; top:0; will-change:transform,opacity; }

  /* ---- HUD tags anchored to 3D points ---- */
  .tag { position:absolute; left:0; top:0; transform-origin:0 0; white-space:nowrap;
    font:700 34px 'JetBrains Mono',monospace; letter-spacing:.2px; padding:10px 18px 11px; border-radius:14px;
    background:rgba(8,14,30,.86); border:2px solid var(--c,#5ee6ff); color:var(--c,#5ee6ff);
    box-shadow:0 0 28px color-mix(in srgb, var(--c,#5ee6ff) 35%, transparent), 0 8px 24px rgba(0,0,0,.5); }
  .tag small { display:block; font:600 24px 'Inter',sans-serif; color:#c9d4ea; margin-top:3px; letter-spacing:0; }
  .tag.big { font-size:40px; }

  /* ---- headline (top) ---- */
  #head { position:absolute; left:0; right:0; top:215px; text-align:center; }
  #head .k { font:800 34px 'Inter'; letter-spacing:7px; color:#8fa3c8; text-transform:uppercase; }
  #head .l { font:900 104px/1.05 'Inter'; letter-spacing:-3px; margin-top:10px; text-shadow:0 6px 40px rgba(0,0,0,.8); }
  #head .l b { color:var(--yellow); }
  #head .l .x { color:var(--red); }
  #head .l2 { font:900 78px/1.1 'Inter'; letter-spacing:-2px; margin-top:8px; color:var(--cyan); text-shadow:0 0 40px rgba(94,230,255,.45); }

  /* ---- terminal ---- */
  #term { position:absolute; left:60px; top:225px; width:960px; border-radius:26px; overflow:hidden;
    background:rgba(9,13,26,.93); border:2px solid #25324f; box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(94,230,255,.06); transform-origin:50% 0; }
  #term .bar { height:62px; background:#141c31; display:flex; align-items:center; padding:0 24px; gap:12px; border-bottom:2px solid #212c47; }
  #term .dot { width:18px; height:18px; border-radius:50%; }
  #term .ttl { margin-left:14px; font:600 28px 'JetBrains Mono'; color:#8fa3c8; }
  #term pre { margin:0; padding:26px 30px 30px; font:500 37px/1.5 'JetBrains Mono',monospace; color:#dbe6ff; white-space:pre; min-height:150px; }
  #term .p { color:var(--green); } #term .d { color:#6f81a6; } #term .hl { background:rgba(255,216,74,.2); color:var(--yellow); border-radius:8px; padding:2px 0; }
  #term .cy { color:var(--cyan); } #term .rd { color:var(--red); } #term .or { color:var(--orange); }
  .cur { display:inline-block; width:20px; height:40px; background:#dbe6ff; vertical-align:-7px; }

  /* ---- cgroup gauges ---- */
  #gauges { position:absolute; left:80px; top:1010px; width:920px; padding:26px 32px 28px; border-radius:26px;
    background:rgba(9,13,26,.93); border:2px solid #4a3320; box-shadow:0 20px 60px rgba(0,0,0,.6); transform-origin:50% 100%; }
  #gauges .row { display:flex; align-items:center; gap:22px; height:74px; }
  #gauges .nm { width:120px; font:800 36px 'JetBrains Mono'; color:var(--orange); }
  #gauges .trk { position:relative; flex:1; height:34px; border-radius:10px; background:#17203a; overflow:visible; }
  #gauges .fill { position:absolute; left:0; top:0; bottom:0; border-radius:10px; background:linear-gradient(90deg,#2dd4bf,#5ee6ff); }
  #gauges .lim { position:absolute; top:-12px; bottom:-12px; width:5px; background:var(--orange); border-radius:3px; box-shadow:0 0 14px var(--orange); }
  #gauges .lim i { position:absolute; left:50%; transform:translateX(-50%); top:-34px; font:700 22px 'JetBrains Mono'; color:var(--orange); font-style:normal; white-space:nowrap; }
  #gauges .val { width:250px; text-align:right; font:700 31px 'JetBrains Mono'; color:#dbe6ff; white-space:nowrap; }
  #gauges .hdr { font:700 26px 'Inter'; letter-spacing:4px; color:#8fa3c8; text-transform:uppercase; margin-bottom:26px; }

  /* ---- finale compare ---- */
  #cmp { position:absolute; left:70px; top:225px; width:940px; padding:28px 34px 30px; border-radius:26px;
    background:rgba(9,13,26,.92); border:2px solid #25324f; box-shadow:0 20px 60px rgba(0,0,0,.6); transform-origin:50% 0; }
  #cmp .row { display:flex; align-items:center; gap:20px; height:70px; }
  #cmp .nm { width:300px; font:800 34px 'Inter'; white-space:nowrap; }
  #cmp .trk { flex:1; height:26px; border-radius:8px; background:#17203a; position:relative; overflow:hidden; }
  #cmp .fill { position:absolute; left:0; top:0; bottom:0; border-radius:8px; }
  #cmp .val { width:250px; text-align:right; font:700 30px 'JetBrains Mono'; white-space:nowrap; }
  #cmp .cnt { margin-top:16px; padding-top:20px; border-top:2px solid #212c47; display:flex; justify-content:space-between; align-items:baseline; }
  #cmp .cnt span { font:700 32px 'Inter'; color:#8fa3c8; }
  #cmp .cnt b { font:800 76px 'JetBrains Mono'; color:var(--cyan); text-shadow:0 0 30px rgba(94,230,255,.5); }

  /* ---- takeaway ---- */
  #fin { position:absolute; left:0; right:0; top:215px; text-align:center; }
  #fin .a { font:900 84px/1.05 'Inter'; letter-spacing:-2px; }
  #fin .a s { color:#7f8cab; text-decoration-color:var(--red); text-decoration-thickness:8px; }
  #fin .b { font:900 108px/1.04 'Inter'; letter-spacing:-3px; margin-top:16px; }
  #fin .b .p1 { color:var(--cyan); text-shadow:0 0 44px rgba(94,230,255,.5); display:inline-block; }
  #fin .b .p2 { color:var(--yellow); text-shadow:0 0 44px rgba(255,216,74,.4); display:inline-block; }
  #fin .chips { display:flex; justify-content:center; gap:16px; margin-top:34px; }
  #fin .chips span { font:700 31px 'JetBrains Mono'; padding:10px 20px; border-radius:999px; border:2px solid var(--c); color:var(--c); background:rgba(8,14,30,.85); }

  /* ---- captions ---- */
  #cap { position:absolute; left:50px; right:50px; top:1318px; height:250px; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:4px 24px; }
  #cap span { display:inline-block; font:900 92px/1.12 'Inter'; letter-spacing:-2px; color:#fff; transform-origin:50% 70%;
    -webkit-text-stroke:14px #060913; paint-order:stroke fill; text-shadow:0 10px 30px rgba(0,0,0,.9); }
  #cap span.kw { color:var(--yellow); }
  #flash { position:absolute; inset:0; background:#ff3b3b; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  #prog { position:absolute; left:0; top:0; height:8px; background:linear-gradient(90deg,#5ee6ff,#ffd84a); width:0; opacity:.85; }
  #gauges { top:225px !important; padding:20px 30px 18px !important; border-color:#4a3320; }
  #gauges .row { height:56px !important; }
  #gauges .row2 { display:flex; align-items:center; gap:22px; height:54px; font:700 33px 'JetBrains Mono'; }
  #gauges .nm { width:190px; font-size:32px; }
  #gauges .val { width:230px; }
  #head .l2 { font-size:58px; color:var(--red); text-shadow:0 0 40px rgba(255,90,90,.45); letter-spacing:-1px; margin-top:14px; }
  #fin .a b { color:var(--yellow); }
  #head .l2 { color:#ff9d4d !important; font-size:70px !important; text-shadow:0 0 40px rgba(255,157,77,.45) !important; }
  #cmp .note { margin-top:14px; padding-top:16px; border-top:2px solid #212c47; font:600 27px 'Inter'; color:#8fa3c8; letter-spacing:.5px; }
  #cmp .nm { width:150px !important; font:800 40px 'JetBrains Mono' !important; }
  #cmp .val { width:230px !important; font-size:36px !important; }
  #cmp .trk { height:34px !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vig"></div>
  <div id="tags"></div>
  <div id="head">
    <div class="k" id="hk">Angular × TypeScript 7</div>
    <div class="l" id="hl">TS 7 <span class="x" id="hx" style="margin:0 10px">broke</span> <b>ngc</b></div>
    <div class="l2" id="hl2">→ rewriting it in Rust</div>
  </div>
  <div id="cmp">
    <div class="row"><div class="nm" style="color:#fb7185">ngc</div><div class="trk"><div class="fill" id="b1" style="background:#fb7185"></div></div><div class="val" id="v1" style="color:#fb7185"></div></div>
    <div class="row"><div class="nm" style="color:#ff9d4d">ngp</div><div class="trk"><div class="fill" id="b2" style="background:linear-gradient(90deg,#ff9d4d,#ffd84a)"></div></div><div class="val" id="v2" style="color:#ffd84a"></div></div>
    <div class="note">build speed · early community benchmarks</div>
  </div>
  <div id="fin">
    <div class="a" id="fa">Your framework is only<br>as fast as <b>its tools</b></div>
    <div class="b"><span class="p1" id="fp1">Tools are</span><br><span class="p2" id="fp2">going native</span></div>
    <div class="chips" id="fch"><span style="--c:var(--cyan)">TypeScript 7 → Go</span><span style="--c:var(--orange)">Angular ngp → Rust</span></div>
  </div>
  <div id="cap"></div>
  <div id="flash"></div>
  <div id="prog"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
